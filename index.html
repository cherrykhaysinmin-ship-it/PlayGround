function home(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">YOUR NEXT GREAT RUN STARTS HERE</div><h1>MAKE YOUR<br><em>MARK.</em></h1><p>Color the arena. Draw a daring trail. Close the loop and turn empty space into your kingdom.</p><div class="actions"><button class="primary" data-action="quickplay">PLAY NOW <span class="arrow">↗</span></button><button class="secondary" data-page="maps">CHOOSE A MAP</button><span class="tiny-note">✦ Free to play · Offline ready</span></div></div><div class="showcase"><div class="show-grid"></div><div class="show-tag tag-a">✦ CURRENT SEASON <b>Paper Planes</b></div><div class="territory-board">${Array.from({length:63},(_,i)=>`<i class="tile" style="animation-delay:${(i%9)*-.22}s"></i>`).join('')}</div><div class="paper-player">▧</div><i class="floating-square f1"></i><i class="floating-square f2"></i><i class="floating-square f3"></i><div class="show-tag tag-b"><b>01</b>ONE TRAIL. BIG AMBITION.</div></div></section><div class="section-head"><div><h2>Pick your playstyle</h2><p>Five ways to make the arena yours.</p></div><button class="text-link" data-page="modes">ALL MODES →</button></div><section class="mode-grid">${MODES.slice(0,4).map(([id,ic,n,d,s])=>`<article class="mode-card" data-mode="${id}"><div class="mode-icon">${ic}</div><h3>${n}</h3><p>${d}</p><span class="chev">↗</span></article>`).join('')}</section><section class="bottom-grid"><article class="panel mission-card"><div class="mission-top"><h3>⚑ Daily mission</h3><span>+75 COINS</span></div><div class="mission-desc">Capture 500 tiles across your matches</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,(save.missions.captures||0)/5)}%"></div></div><div class="mission-foot"><span>${Math.min(500,save.missions.captures||0)} / 500 tiles</span><button class="text-link" data-page="missions">VIEW MISSIONS →</button></div></article><article class="panel daily-card"><div class="mission-top"><h3>🎁 Daily drop</h3><span>READY TO CLAIM?</span></div><div class="mission-desc">A little something to keep your paper empire growing.</div><button class="small-btn secondary" data-page="rewards" style="padding:9px 13px;font-size:9px">OPEN REWARDS →</button></article></section>`}

function maps(){return `${screenHead('Map select','Unlock new worlds by winning matches. Choose your battlefield.')}<div class="map-grid">${MAPS.map(([n,d,bg,em,idx])=>{let unlocked=save.unlockedMaps.includes(idx),sel=save.selectedMap===idx;return `<article class="map-card ${sel?'selected':''}" data-map="${idx}"><div class="map-preview" style="--mapbg:${bg}"><span class="map-glyph">${em}</span></div><div class="map-card-body"><h3>${n}</h3><p>${d}</p><div class="map-foot"><span>${unlocked?'✦ UNLOCKED':`🔒 ${idx} WINS TO UNLOCK`}</span><span class="${sel?'select-label':''}">${sel?'✓ SELECTED':unlocked?'SELECT →':'LOCKED'}</span></div></div></article>`}).join('')}</div>`}
function shop(){let items=SHOP[shopTab];return `${screenHead('The shop','Dress up your square and leave a trail worth chasing.')}<div class="tab-row">${Object.keys(SHOP).map(t=>`<button class="tab ${shopTab===t?'active':''}" data-tab="${t}">${t.toUpperCase()}</button>`).join('')}</div><div class="item-grid">${items.map(([name,icon,price])=>{let owned=(save.owned[shopTab]||[]).includes(name),equipped=save.equipped[shopTab]===name;return `<article class="panel item-card"><div class="item-visual">${icon}</div><h3>${name}</h3><p>${owned?(equipped?'Currently equipped':'Ready for your loadout'):`A little extra personality for the arena.`}</p><button class="${equipped?'equipped':''}" data-item="${name}" data-price="${price}" ${equipped?'disabled':''}>${equipped?'✓ EQUIPPED':owned?'EQUIP':`● ${price} COINS`}</button></article>`}).join('')}</div>`}
function profile(){let pct=save.matches?Math.round(save.best):0;return `${screenHead('Player profile','Your paper empire, all in one place.')}<section class="profile-layout"><article class="panel profile-hero"><div class="profile-avatar">${save.avatar}</div><div class="eyebrow" style="justify-content:center">LEVEL ${save.level} PAPER PILOT</div><h2 style="font:700 21px 'Space Grotesk';margin:12px 0">${save.name}</h2><label style="display:block;color:#9da1b7;font-size:10px;margin-bottom:8px">EDIT USERNAME</label><input id="nameInput" maxlength="18" value="${escapeHtml(save.name)}"><div style="font-size:10px;color:#a1a5bb;margin-top:12px">XP TO NEXT LEVEL</div><div class="progress-track" style="margin:8px auto;width:80%"><div class="progress-fill" style="width:${save.xp}%"></div></div><div style="font-size:10px;color:#c8f76a">${save.xp} / 100 XP</div><div style="margin-top:17px;color:#9da1b7;font-size:10px">FAVORITE SKIN · <b style="color:#fff">${save.skin}</b></div></article><div><div class="panel" style="padding:16px"><div class="stat-grid">${[['MATCHES',save.matches],['WINS',save.wins],['LOSSES',save.losses],['TILES CLAIMED',save.captured.toLocaleString()],['ELIMINATIONS',save.eliminations],['BEST AREA',`${pct}%`]].map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div></div><div class="panel" style="padding:17px;margin-top:13px"><div class="mission-top"><h3>🏅 Achievements</h3><span>${save.wins} WINS</span></div><div class="achievement-row" style="margin-top:14px"><span class="badge">🟩 First Footprint</span><span class="badge">${save.captured>=100?'🏆':'🔒'} Land Grabber</span><span class="badge">${save.wins>=1?'⭐':'🔒'} First Victory</span><span class="badge">${save.wins>=5?'🔥':'🔒'} Win Streak</span></div></div></div></section>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function missions(){let cap=save.missions.captures||0,wins=save.missions.wins||0;return `${screenHead('Missions','Small goals. Bigger territory. Rewards land automatically.')}<div class="cards">${[['🖍️','Claim the page',`Capture 500 tiles · ${Math.min(500,cap)} / 500`,cap/5,75],['🏁','Get a win','Win 1 match · '+Math.min(1,wins)+' / 1',wins*100,100],['🧭','Explore the atlas',`Play on ${Math.min(3,save.matches)} / 3 maps`,save.matches*33,90]].map(([ic,n,d,p,r])=>`<article class="panel feature-card"><div style="font-size:23px">${ic}</div><h3>${n}</h3><p>${d}</p><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,p)}%"></div></div><div class="mission-foot"><span>REWARD</span><span class="reward">● ${r} COINS</span></div></article>`).join('')}</div>`}
function rewards(){let today=new Date().toDateString(),claimed=save.dailyDay===today;return `${screenHead('Daily rewards','A little paper fortune, every day you drop in.')}<article class="panel" style="max-width:680px;margin:auto;padding:25px"><div class="eyebrow">DAILY DROP · ${claimed?'CLAIMED TODAY':'AVAILABLE NOW'}</div><h2 style="font:700 25px 'Space Grotesk';margin:14px 0 7px">${claimed?'Come back tomorrow!':'Your streak starts here.'}</h2><p style="color:#a1a5bb;font-size:12px">Build your daily streak and earn a bigger bundle every seventh day.</p><div class="cards" style="grid-template-columns:repeat(7,1fr);gap:8px;margin:20px 0">${[50,60,75,90,110,130,250].map((n,i)=>`<div class="stat" style="text-align:center;padding:12px 4px"><span>DAY ${i+1}</span><b style="font-size:14px;color:#ffd76c;margin-top:8px">● ${n}</b></div>`).join('')}</div><button class="primary" data-action="daily" ${claimed?'disabled':''}>${claimed?'✓ CLAIMED':'CLAIM TODAY’S REWARD'} →</button></article>`}
function leaderboard(){let rows=[[save.name,save.wins,'YOU'],['PixelPanda',24,'BOT'],['NeonNoodle',19,'BOT'],['CaptainCrumb',16,'BOT'],['MintySquare',12,'BOT'],['OrbitToast',9,'BOT'],['BerryByte',7,'BOT']].sort((a,b)=>b[1]-a[1]);return `${screenHead('Leaderboard','The top paper pilots in your offline arcade.')}<article class="panel" style="max-width:720px;margin:auto;padding:8px 17px">${rows.map(([n,v,tag],i)=>`<div class="leader-row"><span class="leader-rank">${String(i+1).padStart(2,'0')}</span><span>${['🟧','🐼','🍜','🧢','🌿','🪐','🍓'][i]} &nbsp;${escapeHtml(n)} ${tag==='YOU'?'<small style="color:#c8f76a">YOU</small>':''}</span><b style="color:#c8f76a">${v} wins</b></div>`).join('')}</article>`}
function settings(){return `${screenHead('Settings','Make PAPER WORLD feel right at home.')}<article class="panel" style="max-width:680px;margin:auto;padding:8px 18px"><div class="settings-row"><span>Sound effects</span><button class="toggle ${save.sound?'on':''}" data-action="sound" aria-label="Toggle sound"></button></div><div class="settings-row"><span>Reduce motion</span><button class="toggle" data-action="motion" aria-label="Toggle motion"></button></div><div class="settings-row"><span>Controls</span><span style="color:#9fa3ba">WASD / ARROWS · SPACE TO DASH</span></div><div class="settings-row"><span>Game version</span><span style="color:#9fa3ba">ULTIMATE V3.0</span></div><div class="settings-row"><span>Save data</span><button class="small-btn secondary" style="padding:8px 12px" data-action="reset">RESET LOCAL SAVE</button></div></article>`}
function render(){navDraw();let pages={home,modes,maps,shop,profile,missions,rewards,leaderboard,settings,game:gameScreen};view.innerHTML=pages[currentPage]?.()||home();updateHeader()}
const CW=960,CH=600,COLS=40,ROWS=25,CELL=24;const COLORS=['#bcf36b','#ff719d','#62dce8','#ffb65c','#a885ff','#62dc9b','#f4e268','#ff6e5d','#65a5ff'];const MAPSTYLES=[['#222844','#a6b0d0'],['#15132f','#31dff5'],['#4b382d','#ffbf6a'],['#b9e8f4','#4d91b7'],['#243f35','#8fe28c'],['#141525','#aaa6ff'],['#57344e','#ffb4db'],['#46252a','#ff875b'],['#211b45','#72ddff'],['#332b20','#ffda67']];let game=null,frameId=0;
function gameScreen(){return `<div class="game-wrap"><div class="game-top"><div class="game-title"><span id="gameModeName">CLASSIC ARENA</span><small>${MAPS[save.selectedMap][0]} · ONE TRAIL. BIG AMBITION.</small></div><div class="game-stats"><div class="game-stat"><b id="timeStat">03:00</b><span>TIME</span></div><div class="game-stat"><b id="areaStat">0%</b><span>YOUR AREA</span></div><div class="game-stat"><b id="botsStat">8</b><span>RIVALS</span></div></div></div><div class="game-shell"><canvas id="gameCanvas" class="game-canvas" width="960" height="600" aria-label="Paper World territory arena"></canvas><div id="gameOverlay" class="game-overlay"><div class="overlay-card"><div class="result-emoji">▧</div><div class="eyebrow" style="justify-content:center">${MAPS[save.selectedMap][0].toUpperCase()}</div><h2>Ready, ${escapeHtml(save.name)}?</h2><p>Move with <b>WASD / arrow keys</b>. Leave your territory and loop back to claim the space. Tap <b>SPACE</b> for a paper dash!</p><button class="primary" data-action="startGame">START MATCH →</button></div></div><div class="mobile-controls"><button class="dpad" data-dir="up">↑</button><button class="dpad" data-dir="left">←</button><button class="dpad" data-dir="down">↓</button><button class="dpad" data-dir="right">→</button></div></div><div class="game-footer"><span><span class="keycap">WASD</span> MOVE &nbsp; <span class="keycap">SPACE</span> DASH <span id="dashInfo" style="color:#c8f76a">READY</span></span><button class="pause-btn" data-action="pauseGame">Ⅱ PAUSE</button></div></div>`}
function startGame(mode=selectedMode){selectedMode=mode;currentPage='game';render();const overlay=$('#gameOverlay');overlay.style.display='none';const counts={classic:8,time:8,survival:4,practice:2,hardcore:8};let n=counts[mode]||8;if(mode==='hardcore')n=8;game={mode,owner:new Int8Array(COLS*ROWS).fill(-1),trails:new Int8Array(COLS*ROWS).fill(-1),players:[],stepAcc:0,last:0,elapsed:0,ended:false,paused:false,dashUntil:0,dashReady:0,dashCooldown:0,captured:0,aliveBots:n};let points=[[5,12],[32,5],[34,19],[7,20],[19,4],[19,20],[5,4],[34,12],[21,12]];for(let i=0;i<=n;i++){let p=points[i],id=i;game.players.push({id,x:p[0],y:p[1],dir:[[1,0],[0,1],[-1,0],[0,-1]][i%4],trail:[],alive:true,turn:0,home:p,ai:i>0,skill:mode==='hardcore'?2:mode==='practice'?0:1,score:0,respawn:0})}for(let p of game.players)for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)claim(p.id,x,y);$('#gameModeName').textContent=MODES.find(a=>a[0]===mode)[2].toUpperCase()+' ARENA';$('#botsStat').textContent=n;game.last=performance.now();gameTick(game.last);}
function ix(x,y){return y*COLS+x}function inside(x,y){return x>=0&&y>=0&&x<COLS&&y<ROWS}function claim(id,x,y){if(inside(x,y))game.owner[ix(x,y)]=id}
function dirFor(d){return {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d]}
function changeDir(d){if(!game||game.ended||game.paused)return;let v=dirFor(d);if(!v)return;let p=game.players[0];if(v[0]===-p.dir[0]&&v[1]===-p.dir[1])return;p.dir=v}
function dash(){if(!game||game.ended||game.paused||performance.now()<game.dashCooldown)return;game.dashUntil=performance.now()+850;game.dashCooldown=performance.now()+5200;toast('PAPER DASH!');}
function aiChoose(p){let dirs=[[1,0],[0,1],[-1,0],[0,-1]].filter(d=>!(d[0]===-p.dir[0]&&d[1]===-p.dir[1]));let open=p.trail.length>0;let options=dirs.filter(d=>{let x=p.x+d[0],y=p.y+d[1];return inside(x,y)&&game.trails[ix(x,y)]!==p.id});if(!options.length)return;p.turn++;if(open&&p.trail.length>=(p.skill===2?10:15)){let own=options.filter(d=>game.owner[ix(p.x+d[0],p.y+d[1])]===p.id);if(own.length){p.dir=own.sort((a,b)=>dist(p.x+a[0],p.y+a[1],p.home[0],p.home[1])-dist(p.x+b[0],p.y+b[1],p.home[0],p.home[1]))[0];return}}if(!open){let enemy=options.find(d=>game.owner[ix(p.x+d[0],p.y+d[1])]!==p.id);if(enemy&&p.turn%5===0){p.dir=enemy;return}}let shouldTurn=p.turn%(p.skill===2?3:5)===0||Math.random()<(p.skill===2?.1:.18);if(shouldTurn)p.dir=options[Math.floor(Math.random()*options.length)]}
function dist(x,y,a,b){return Math.abs(x-a)+Math.abs(y-b)}
function doStep(p){if(!p.alive)return;let [dx,dy]=p.dir,nx=p.x+dx,ny=p.y+dy;if(!inside(nx,ny)){die(p);return}let k=ix(nx,ny),trailOwner=game.trails[k];if(trailOwner>=0&&trailOwner!==p.id){let target=game.players[trailOwner];if(target)die(target);game.trails[k]=-1}if(trailOwner===p.id){die(p);return}p.x=nx;p.y=ny;if(p.ai)aiChoose(p);if(game.owner[k]!==p.id){game.trails[k]=p.id;p.trail.push(k);if(p.trail.length>160){die(p);return}}else if(p.trail.length){closeLoop(p)}if(game.trails[k]>=0&&game.trails[k]!==p.id){let victim=game.players[game.trails[k]];if(victim)die(victim);game.trails[k]=-1}}
function closeLoop(p){let id=p.id;for(let k of p.trail){game.owner[k]=id;game.trails[k]=-1}let seen=new Uint8Array(COLS*ROWS),q=[];const add=(x,y)=>{if(!inside(x,y))return;let k=ix(x,y);if(seen[k]||game.owner[k]===id)return;seen[k]=1;q.push(k)};for(let x=0;x<COLS;x++){add(x,0);add(x,ROWS-1)}for(let y=0;y<ROWS;y++){add(0,y);add(COLS-1,y)}for(let i=0;i<q.length;i++){let k=q[i],x=k%COLS,y=(k/COLS)|0;add(x+1,y);add(x-1,y);add(x,y+1);add(x,y-1)}let gained=0;for(let k=0;k<game.owner.length;k++)if(!seen[k]&&game.owner[k]!==id){game.owner[k]=id;gained++}game.captured+=gained+p.trail.length;p.score+=gained;p.trail=[];if(id===0){save.captured+=gained;save.missions.captures=(save.missions.captures||0)+gained;persist()} }
function die(p){if(!p.alive)return;for(let k of p.trail)game.trails[k]=-1;p.trail=[];p.alive=false;if(p.id===0){game.lives--;game.dashUntil=0;toast(game.mode==='survival'?`Trail snapped! ${Math.max(0,game.lives)} lives left.`:'Trail snapped! Rebuilding your square…');if(game.mode==='survival'&&game.lives<=0){finishGame(false);return}}else{game.aliveBots=Math.max(0,game.aliveBots-1);save.eliminations++;if(Math.random()<.42)save.coins+=5}setTimeout(()=>{if(!game||game.ended)return;if(p.id===0){p.x=p.home[0];p.y=p.home[1];p.alive=true;for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)claim(0,x,y)}else{let h=p.home;p.x=h[0];p.y=h[1];p.alive=true;for(let y=h[1]-1;y<=h[1]+1;y++)for(let x=h[0]-1;x<=h[0]+1;x++)claim(p.id,x,y);game.aliveBots++}},900)}
function percent(id){let n=0;for(let x of game.owner)if(x===id)n++;return Math.round(n*100/game.owner.length)}
function gameTick(now){if(!game||currentPage!=='game')return;let dt=Math.min(80,now-game.last);game.last=now;if(!game.paused&&!game.ended){game.elapsed+=dt;let pace=game.mode==='hardcore'?95:game.mode==='practice'?145:game.mode==='survival'?Math.max(72,140-Math.floor(game.elapsed/30000)*9):120;if(game.dashUntil>now)pace*=.55;game.stepAcc+=dt;while(game.stepAcc>pace){game.stepAcc-=pace;for(let p of game.players)if(p.ai&&p.alive){if(game.mode==='survival')p.skill=Math.min(2,Math.floor(game.elapsed/45000));doStep(p)}let user=game.players[0];if(user.alive)doStep(user)}if(game.mode==='survival'&&game.elapsed>=300000)finishGame(true);else if(game.mode!=='survival'&&(game.elapsed>=180000||percent(0)>=42))finishGame(percent(0)>=42);if(game.mode==='classic'&&game.aliveBots===0)finishGame(true)}drawGame();updateGameHud(now);frameId=requestAnimationFrame(gameTick)}
function finishGame(won){if(!game||game.ended)return;game.ended=true;cancelAnimationFrame(frameId);let area=percent(0);save.matches++;save.best=Math.max(save.best,area);let score=Math.floor(game.captured+area*4);if(game.mode==='time')save.highscore=Math.max(save.highscore,score);let victory=won||area>=42;if(victory){save.wins++;save.missions.wins=(save.missions.wins||0)+1;save.coins+=100;save.xp+=45;toast('Victory! +100 coins · +45 XP')}else{save.losses++;save.coins+=25;save.xp+=15}while(save.xp>=100){save.xp-=100;save.level++;save.coins+=75}save.unlockedMaps=[...new Set([...save.unlockedMaps,...MAPS.filter((_,i)=>i<=save.wins).map((_,i)=>i)])];persist();let ov=$('#gameOverlay');ov.style.display='grid';ov.innerHTML=`<div class="overlay-card"><div class="result-emoji">${victory?'🏆':'🧻'}</div><div class="eyebrow" style="justify-content:center">MATCH COMPLETE · ${MAPS[save.selectedMap][0].toUpperCase()}</div><h2>${victory?'Board conquered!':'Nice run!'}</h2><p>You claimed <b>${area}%</b> of the arena and earned <b>${victory?100:25} coins</b>${game.mode==='time'?`<br>Run score: ${score} · Best: ${save.highscore}`:''}</p><div class="actions" style="justify-content:center"><button class="primary" data-action="replay">PLAY AGAIN</button><button class="secondary" data-action="home">MAIN MENU</button></div></div>`}
function drawGame(){let c=$('#gameCanvas');if(!c||!game)return;let ctx=c.getContext('2d'),[bg,grid]=MAPSTYLES[save.selectedMap];ctx.clearRect(0,0,CW,CH);ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);if(save.selectedMap===5){for(let i=0;i<55;i++){let x=(i*173+43)%CW,y=(i*89+17)%CH;ctx.fillStyle='#ffffff88';ctx.fillRect(x,y,1.5,1.5)}}if(save.selectedMap===7){for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#ff8b4930':'#ffce5830';ctx.beginPath();ctx.arc((i*177+80)%CW,(i*113+40)%CH,18+i%4*6,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#ffffff0a';ctx.fillRect(0,0,CW,CH);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){let k=ix(x,y),own=game.owner[k];if(own>=0){ctx.fillStyle=COLORS[own%COLORS.length];ctx.globalAlpha=.48;ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2);ctx.globalAlpha=1}let tid=game.trails[k];if(tid>=0){ctx.fillStyle=COLORS[tid%COLORS.length];ctx.shadowColor=COLORS[tid%COLORS.length];ctx.shadowBlur=10;ctx.fillRect(x*CELL+4,y*CELL+4,CELL-8,CELL-8);ctx.shadowBlur=0}}ctx.strokeStyle=grid+'28';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,CH);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(CW,y*CELL);ctx.stroke()}for(const p of game.players){if(!p.alive)continue;let x=p.x*CELL+CELL/2,y=p.y*CELL+CELL/2,color=COLORS[p.id%COLORS.length];ctx.save();ctx.translate(x,y);ctx.shadowColor=color;ctx.shadowBlur=p.id===0?18:9;ctx.fillStyle=color;let size=p.id===0?17:14;ctx.beginPath();ctx.roundRect(-size/2,-size/2,size,size,4);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(-3,-1,1.5,0,Math.PI*2);ctx.arc(3,-1,1.5,0,Math.PI*2);ctx.fill();ctx.restore();if(p.id!==0){ctx.fillStyle='#ffffff99';ctx.font='9px DM Sans';ctx.textAlign='center';ctx.fillText(['Mochi','Zippy','Pip','Dot','Nova','Boba','Kiki','Byte'][p.id-1],x,y-12)}}ctx.strokeStyle='#ffffff66';ctx.lineWidth=2;ctx.strokeRect(1,1,CW-2,CH-2)}
function updateGameHud(now){if(!game)return;let left=Math.max(0,180-Math.floor(game.elapsed/1000)),time=game.mode==='survival'?`${Math.floor(game.elapsed/60000)}:${String(Math.floor(game.elapsed/1000)%60).padStart(2,'0')}`:`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;$('#timeStat').textContent=time;$('#areaStat').textContent=percent(0)+'%';$('#botsStat').textContent=game.aliveBots;$('#dashInfo').textContent=now<game.dashCooldown?`${Math.ceil((game.dashCooldown-now)/1000)}s`:'READY'}
function navigate(page){if(page!=='game'&&game){cancelAnimationFrame(frameId);game=null}currentPage=page;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{let page=e.target.closest('[data-page]')?.dataset.page;if(page){navigate(page);return}let mode=e.target.closest('[data-mode]')?.dataset.mode;if(mode){selectedMode=mode;startGame(mode);return}let map=e.target.closest('[data-map]')?.dataset.map;if(map!==undefined){let i=Number(map);if(!save.unlockedMaps.includes(i)){toast(`Win ${i} match${i===1?'':'es'} to unlock this map.`);return}save.selectedMap=i;persist();render();return}let tab=e.target.closest('[data-tab]')?.dataset.tab;if(tab){shopTab=tab;render();return}let item=e.target.closest('[data-item]');if(item){let n=item.dataset.item,cost=Number(item.dataset.price),owned=save.owned[shopTab]||[];if(!owned.includes(n)){if(save.coins<cost){toast('Not enough coins yet. Play a match to earn more!');return}save.coins-=cost;owned.push(n);save.owned[shopTab]=owned}save.equipped[shopTab]=n;if(shopTab==='Skins')save.skin=n;if(shopTab==='Avatars'){let arr=SHOP.Avatars;save.avatar=arr.find(x=>x[0]===n)?.[1]||'🟧'}persist();toast(`${n} equipped!`);render();return}let act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;if(act==='quickplay'){startGame('classic')}if(act==='startGame'){startGame(selectedMode)}if(act==='replay'){let m=game?.mode||selectedMode;startGame(m)}if(act==='home'){navigate('home')}if(act==='pauseGame'&&game){game.paused=!game.paused;let ov=$('#gameOverlay');ov.style.display=game.paused?'grid':'none';if(game.paused)ov.innerHTML=`<div class="overlay-card"><div class="result-emoji">Ⅱ</div><div class="eyebrow" style="justify-content:center">TAKE A BREATHER</div><h2>Match paused</h2><p>Your arena is waiting right where you left it.</p><div class="actions" style="justify-content:center"><button class="primary" data-action="pauseGame">RESUME →</button><button class="secondary" data-action="home">QUIT MATCH</button></div></div>`;if(!game.paused){game.last=performance.now();gameTick(game.last)}}if(act==='daily'){let today=new Date().toDateString();if(save.dailyDay===today){toast('You already claimed today’s reward.');return}let yesterday=new Date(Date.now()-86400000).toDateString();save.dailyStreak=save.dailyDay===yesterday?(save.dailyStreak||0)+1:1;save.dailyDay=today;let reward=save.dailyStreak%7===0?250:50+Math.min(save.dailyStreak-1,5)*15;save.coins+=reward;persist();toast(`Daily drop claimed! +${reward} coins`);render()}if(act==='sound'){save.sound=!save.sound;persist();render()}if(act==='motion'){e.target.classList.toggle('on')}if(act==='reset'){if(confirm('Reset all local Paper World progress? This cannot be undone.')){localStorage.removeItem('paperWorldSave');save={...DEFAULT,owned:{...DEFAULT.owned},equipped:{...DEFAULT.equipped}};persist();toast('Local save reset.');render()}}});
document.addEventListener('input',e=>{if(e.target.id==='nameInput'){save.name=e.target.value.trim()||'PaperPilot';persist()}});
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();if(e.key==='Escape'&&game&&!game.ended){document.querySelector('[data-action="pauseGame"]')?.click();return}let key=e.key.toLowerCase(),dir={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'}[key];if(dir)changeDir(dir);if(e.code==='Space')dash()});document.querySelectorAll('.dpad').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();changeDir(b.dataset.dir)}));let touchStart=null;document.addEventListener('touchstart',e=>{if(!e.target.closest('#gameCanvas'))return;let t=e.changedTouches[0];touchStart=[t.clientX,t.clientY]},{passive:true});document.addEventListener('touchend',e=>{if(!touchStart)return;let t=e.changedTouches[0],dx=t.clientX-touchStart[0],dy=t.clientY-touchStart[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)changeDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touchStart=null},{passive:true});
updateHeader();render();
</script></body></html>
